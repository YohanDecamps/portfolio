<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/YD.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yohan Decamps Portfolio</title>
    <style>
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #3769E7FF;
        color: #111;
        font-family: monospace;
        transition: opacity 0.3s ease;
      }
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading-bar {
        width: min(320px, 70vw);
        height: 8px;
        background: rgba(0, 0, 0, 0.15);
        border-radius: 4px;
        overflow: hidden;
      }
      #loading-bar-fill {
        width: 0%;
        height: 100%;
        background: #E4E7DBFF;
        transition: width 0.15s ease;
      }
      #loading-text {
        font-size: 14px;
        color: #E4E7DBFF;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div id="loading-bar"><div id="loading-bar-fill"></div></div>
      <div id="loading-text">Loading... 0%</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
